  title: Bear Pride Luxembourg 2025 - Cowboy Edition
  description: |-
    Saddle up for Bear Pride Luxembourg 2025! This year we're embracing our wild side with a Cowboy Edition theme from October 8-12, 2025.

    Four days of unbridled celebration await as Luxembourg's bear community and friends come together for an unforgettable weekend. Whether you're channeling denim daddy vibes, rhinestone rebel energy, or flirty sheriff charm, bring your Wild West fantasy to life in the heart of Europe.

    From intimate gatherings to high-energy parties, we're creating spaces for connection, pride, and authentic celebration. Grab your boots (or don't), tip your hat, and join us for a weekend where community spirit meets cowboy swagger.

    This Pride, we ride together! 🤠🌈
