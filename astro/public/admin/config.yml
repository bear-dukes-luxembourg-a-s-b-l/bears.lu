backend:
  name: github
  repo: bear-dukes-luxembourg-a-s-b-l/bears.lu
  branch: master

site_url: https://bears.lu
logo:
  src: /admin/logo.png
app_title: "Bear Dukes Luxembourg"

# New media uploaded from the CMS lands in /uploads, matching the convention
# already used by most existing content (candidate photos, sponsor logos…).
media_folder: uploads
public_folder: /uploads

# Sveltia omits an optional field entirely when it's left empty, instead of
# writing an empty string/null — keeps the JSON/YAML/frontmatter files clean
# and matches what the Astro content schemas (zod `.optional()`) expect.
output:
  omit_empty_optional_fields: true

collections:
  - name: mrbears
    label: "Mr. Bear titleholders"
    label_singular: "Mr. Bear"
    description: "The yearly Mr. Bear Luxembourg winners, shown on the homepage and the Mr. Bear page."
    folder: astro/src/content/mrbears
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{fields.year}} — {{fields.name}}"
    fields:
      - { name: year, label: Year, hint: "e.g. 2024 or 2016/2017" }
      - { name: name, label: Name }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Photo, widget: image, required: false }
      - name: social
        label: "Social links"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: facebook, label: Facebook, widget: string, required: false }
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: twitter, label: Twitter, widget: string, required: false }
      - name: spotlight
        label: "Show as a homepage announcement"
        widget: boolean
        required: false
        hint: "Turns on a temporary \"Congratulations\" banner on the homepage for this titleholder. Turn it back off once it's been up for a while."

  - name: candidates
    label: "Mr. Bear candidates"
    label_singular: Candidate
    description: "This year's Mr. Bear contestants, shown on the Bear Pride page while applications are open."
    folder: astro/src/content/candidates
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.name}}"
    summary: "{{fields.name}} ({{fields.age}})"
    fields:
      - name: photos
        label: Photos
        widget: list
        field: { name: photo, label: Photo, widget: image }
      - { name: name, label: Name }
      - { name: age, label: Age, widget: string }
      - { name: about, label: About, widget: text }
      - { name: motivation, label: Motivation, widget: text }
      - name: links
        label: "Social links"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: facebook, label: Facebook, widget: string, required: false }
          - { name: tiktok, label: TikTok, widget: string, required: false }
      - name: winner
        label: "Winner — crowned at this year's election"
        widget: boolean
        required: false
        hint: "Set this on the winning candidate once the election's been held. Swaps this page's candidate grid for a winner announcement."

  - name: bear_pride_sponsors
    label: "Bear Pride sponsors"
    label_singular: "Bear Pride sponsor tier"
    description: "Sponsors for this year's Bear Pride edition only — not the year-round home page sponsors below."
    folder: astro/src/content/bear-pride-sponsors
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.tier}}-{{fields.name}}"
    summary: "{{fields.name}} ({{fields.tier}})"
    fields:
      - name: tier
        label: Tier
        widget: select
        options:
          - { label: Gold, value: gold }
          - { label: Silver, value: silver }
          - { label: "Media partner", value: media }
      - { name: name, label: Name }
      - { name: title, label: "Link title", widget: string, required: false }
      - { name: url, label: "Website URL" }
      - { name: image, label: Logo, widget: image }

  - name: general_sponsors
    label: "Home sponsors"
    label_singular: "Home sponsor"
    description: "The asbl's year-round partners, shown on the homepage — separate from the Bear Pride sponsors above."
    folder: astro/src/content/general-sponsors
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.name}}"
    summary: "{{fields.name}}"
    fields:
      - { name: name, label: Name }
      - { name: title, label: "Link title", widget: string, required: false }
      - { name: url, label: "Website URL" }
      - { name: image, label: Logo, widget: image, required: false }

  - name: bear_pride_schedule
    label: "Bear Pride schedule"
    label_singular: "Day"
    description: "The full programme for this year's Bear Pride — every event is its own entry; entries on the same date are grouped into one day on the page."
    folder: astro/src/content/bear-pride-events
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.date}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { name: date, label: Date, widget: datetime, type: date }
      - { name: title, label: Title }
      - { name: time, label: Time, widget: datetime, type: time, format: "h:mm A" }
      - { name: place, label: Venue }
      - { name: place_url, label: "Venue map URL", widget: string, required: false }
      - { name: price, label: Price, widget: string, required: false, hint: "e.g. Free, 15€" }
      - { name: description, label: Description, widget: text, required: false }
      - { name: facebook, label: "Facebook event URL", widget: string, required: false }
      - { name: ticket_url, label: "Tickets URL", widget: string, required: false }
      - { name: rsvp_url, label: "RSVP URL", widget: string, required: false }

  - name: bear_pride_config
    label: "Bear Pride edition settings"
    label_singular: "Bear Pride edition"
    description: "Switches and text for the current Bear Pride edition — the homepage banner, applications toggle and hotel offer."
    files:
      - name: bearpride
        label: "Bear Pride edition settings"
        file: _data/bearpride.yml
        fields:
          - { name: enabled, label: "Show the Bear Pride panel on the homepage", widget: boolean }
          - name: homepage_panel
            label: "Homepage panel"
            widget: object
            fields:
              - { name: title, label: Title }
              - { name: description, label: Description, widget: text }
          - { name: facebook_main_event, label: "Main event Facebook URL", widget: string, required: false }
          - { name: combo_ticket_url, label: "Combo ticket URL", widget: string, required: false }
          - { name: application_open, label: "Mr. Bear applications open", widget: boolean }
          - { name: candidate_list, label: "Show the candidate list", widget: boolean }
          - name: hotel_cta
            label: "Hotel call-to-action"
            widget: object
            fields:
              - { name: display, label: Show, widget: boolean }
              - { name: content, label: Content, widget: text }
              - { name: url, label: "Booking URL" }

  - name: general_events
    label: "Home events"
    label_singular: Event
    description: "Regular community events shown on the homepage — not the Bear Pride programme."
    folder: astro/src/content/general-events
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.date}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { name: title, label: Title }
      - { name: date, label: "Start date", widget: datetime, type: date }
      - name: time
        label: "Start time"
        widget: datetime
        type: time
        format: "h:mm A"
        required: false
        hint: "Only for a single-day event with a fixed start time. For a multi-day event (most community ones), leave this blank and set an end date below instead."
      - name: end_date
        label: "End date"
        widget: datetime
        type: date
        required: false
        hint: "Only for a multi-day event — leave blank for a single-day one."
      - { name: place, label: Venue }
      - { name: place_url, label: "Venue map URL", widget: string, required: false }
      - { name: price, label: Price, widget: string, required: false, hint: "e.g. Free, 15€" }
      - { name: facebook, label: "Facebook event URL", widget: string, required: false }
      - { name: ticket_url, label: "Tickets URL", widget: string, required: false }
      - { name: rsvp_url, label: "RSVP URL", widget: string, required: false }
      - name: community
        label: "Community event (not organized by us)"
        widget: boolean
        required: false
        hint: "Tick this for events we're just relaying — other bear groups' Prides, regional weekends, etc. Leave off for events Bear Dukes itself organizes."
      - name: coordinates
        label: "Location (for the \"X km from you\" feature)"
        widget: geocoder
        required: false
        hint: "Search a city or venue and pick the right result — no need to look up coordinates by hand."

  - name: posts
    label: News
    label_singular: "News post"
    description: "Blog posts shown on the News page."
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { name: layout, label: Layout, widget: hidden, default: post }
      - { name: title, label: Title }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss Z" }
      - { name: image, label: Image, widget: image, required: false }
      - { name: author, label: Author, widget: string, required: false }
      - name: categories
        label: Categories
        widget: list
        required: false
        field: { name: category, label: Category, widget: string }
      - { name: body, label: Body, widget: markdown }
