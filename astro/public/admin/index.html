<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager | Bear Dukes Luxembourg</title>
    <link rel="icon" type="image/png" href="/admin/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * Sveltia's own UI kit (Sveltia UI / "sui") exposes its whole palette
       * as HSL custom properties, driven mostly by one base hue — so the
       * easiest way to make the admin feel like the rest of the site is to
       * retune those instead of overriding individual components.
       * See https://sveltiacms.app/en/docs/customization
       */
      /*
       * Sveltia injects its own :root rule at runtime, after this one in
       * document order, so without !important it would win every tie.
       */
      :root {
        /* Site's border/background tones sit around hue 25-30 (warm brown);
           the accent below is set explicitly to the exact site gold. */
        --sui-base-hue: 28 !important;

        /*
         * -text is accent-COLORED text for use on the app's dark background
         * (links, outlined/secondary buttons, selected-state icons) — keep
         * it light. -inverted is the text color placed ON TOP OF a solid
         * accent (gold) background, e.g. the primary Save button — that one
         * needs to be dark for contrast. Mixing these two up (as an earlier
         * version of this file did) made the GitHub sign-in button's text
         * nearly invisible: dark ink on its dark, not-gold-filled background.
         */
        --sui-primary-accent-color-text: #f3e4c4 !important;
        --sui-primary-accent-color-light: #f3e4c4 !important;
        --sui-primary-accent-color: #e8c25a !important;
        --sui-primary-accent-color-dark: #c9a042 !important;
        --sui-primary-accent-color-inverted: #141210 !important;
        --sui-primary-accent-color-translucent: rgb(232 194 90 / 25%) !important;

        --sui-font-family-default: 'Inter', system-ui, sans-serif !important;

        /* Site uses soft, consistently rounded corners (10-16px) rather
           than Sveltia's default tight 4px — echo that here. */
        --sui-control-small-border-radius: 8px !important;
        --sui-control-medium-border-radius: 10px !important;
        --sui-control-large-border-radius: 12px !important;
        --sui-button-small-border-radius: 8px !important;
        --sui-button-medium-border-radius: 10px !important;
        --sui-button-large-border-radius: 12px !important;
        --sui-listbox-border-radius: 12px !important;
        --sui-option-border-radius: 8px !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.261.0/dist/sveltia-cms.js" type="module"></script>
    <script type="module">
      // Custom "geocoder" field type: lets an editor search a place name
      // instead of typing latitude/longitude by hand. Stores the same
      // { lat, lon } shape the "coordinates" field already expects, via
      // OpenStreetMap's free Nominatim API (no key needed; usage policy at
      // https://operations.osmfoundation.org/policies/nominatim/ — fine for
      // this site's occasional, low-volume use).
      const { useState } = CMS.React;

      const GeocoderControl = ({ forID, classNameWrapper, value, onChange }) => {
        const [query, setQuery] = useState('');
        const [results, setResults] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');

        const search = async () => {
          if (!query.trim()) return;
          setLoading(true);
          setError('');
          setResults([]);
          try {
            const res = await fetch(
              `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`
            );
            const data = await res.json();
            if (data.length === 0) setError('No results found — try a broader search.');
            setResults(data);
          } catch {
            setError('Lookup failed — check your connection and try again.');
          } finally {
            setLoading(false);
          }
        };

        const pick = (result) => {
          onChange({ lat: parseFloat(result.lat), lon: parseFloat(result.lon) });
          setResults([]);
          setQuery(result.display_name);
        };

        return html`
          <div class=${classNameWrapper} style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 8px;">
              <input
                id=${forID}
                type="text"
                placeholder="Search a city or venue…"
                value=${query}
                onChange=${(e) => setQuery(e.target.value)}
                onKeyDown=${(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    search();
                  }
                }}
                style="flex: 1; min-width: 0;"
              />
              <button type="button" onClick=${search} disabled=${loading}>
                ${loading ? 'Searching…' : 'Search'}
              </button>
            </div>
            ${error && html`<div style="color: #d16a6a; font-size: 12px;">${error}</div>`}
            ${results.length > 0 &&
            html`
              <ul
                style="list-style: none; margin: 0; padding: 0; border: 1px solid #332c23; border-radius: 8px; max-height: 180px; overflow: auto;"
              >
                ${results.map(
                  (r) => html`
                    <li key=${r.place_id}>
                      <button
                        type="button"
                        onClick=${() => pick(r)}
                        style="display: block; width: 100%; text-align: left; padding: 8px 10px; background: none; border: none; cursor: pointer; font-size: 13px;"
                      >
                        ${r.display_name}
                      </button>
                    </li>
                  `
                )}
              </ul>
            `}
            ${value?.lat != null &&
            value?.lon != null &&
            html`
              <div style="font-size: 12px; color: #afa393;">
                Current: ${value.lat.toFixed(4)}, ${value.lon.toFixed(4)}
                <button type="button" onClick=${() => onChange(undefined)} style="margin-left: 8px;">
                  Clear
                </button>
              </div>
            `}
          </div>
        `;
      };

      const GeocoderPreview = ({ value }) =>
        value?.lat != null
          ? html`<span>${value.lat.toFixed(4)}, ${value.lon.toFixed(4)}</span>`
          : html`<span>—</span>`;

      CMS.registerFieldType('geocoder', GeocoderControl, GeocoderPreview);
    </script>
  </body>
</html>
