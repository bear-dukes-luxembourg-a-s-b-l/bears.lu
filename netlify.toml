[build]
  base = "astro"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  # The site's default Node on Netlify is a leftover from the Jekyll days
  # (v10 — Node was barely used there) and is far too old for Astro 7 /
  # Tailwind v4's native deps (lightningcss etc. need Node >= 12, and
  # astro/package.json itself requires >= 22.23.4).
  NODE_VERSION = "22"

[dev]
  autoLaunch = true
