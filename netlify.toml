[build]
  base = "astro"
  command = "npm install && npm run build"
  # Resolved against the repo root, not against `base`, despite the name —
  # Astro itself builds into astro/dist (confirmed in the build log), so
  # without the astro/ prefix Netlify looked for a repo-root dist/ that
  # never existed and failed at the deploy stage with a passing build.
  publish = "astro/dist"

[build.environment]
  # The site's default Node on Netlify is a leftover from the Jekyll days
  # (v10 — Node was barely used there) and is far too old for Astro 7 /
  # Tailwind v4's native deps (lightningcss etc. need Node >= 12, and
  # astro/package.json itself requires >= 22.23.4).
  NODE_VERSION = "22"

[dev]
  autoLaunch = true
